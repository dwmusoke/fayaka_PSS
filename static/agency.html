<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Direct E-ticket · Agency Desk</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background:#eef2f7; }
    .ag-shell { width:min(900px,100%); margin:0 auto; padding:20px 16px 50px; }
    .ag-hero { background:linear-gradient(135deg,#0f2742,#0b6efd); color:#fff; border-radius:16px; padding:24px 28px; margin-bottom:16px; }
    .ag-hero h1 { margin:6px 0 4px; font-size:25px; }
    .ag-hero p { margin:0; opacity:.85; font-size:13px; }
    .ag-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; margin-bottom:14px; }
    .ag-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .ag-grid label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#64748b; margin-bottom:5px; }
    .ag-grid input { width:100%; box-sizing:border-box; padding:10px 11px; border:1px solid #cfd8e3; border-radius:9px; }
    .ag-btn { border:0; background:#0b6efd; color:#fff; padding:11px 20px; border-radius:9px; font-weight:700; cursor:pointer; margin-top:12px; }
    .ag-btn.secondary { background:#eef4ff; color:#0f2742; }
    .pill { display:inline-block; padding:4px 9px; border-radius:99px; background:#dcfce7; color:#166534; font-size:10px; font-weight:700; }
    .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:13px; border-radius:10px; }
    .error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:12px; border-radius:10px; }
    .muted { color:#64748b; font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eef1f5; }
    th { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#64748b; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="ag-shell">
    <div class="ag-hero">
      <div style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.8">Direct e-ticket distribution</div>
      <h1 id="ag-title">Travel Agency Desk</h1>
      <p id="ag-subtitle">Book instantly against airline-issued e-ticket stock. Every booking is traced end to end.</p>
    </div>
    <div id="offer-card" class="ag-card">Loading direct e-ticket offer...</div>
    <div id="book-card" class="ag-card hidden"></div>
    <div id="confirm-card" class="ag-card hidden"></div>
    <div id="list-card" class="ag-card"></div>
  </div>
  <script src="/config.js"></script>
  <script src="/agency.js"></script>
</body>
</html>
