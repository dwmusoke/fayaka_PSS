<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Document · Live Share</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: #f1f5f9; }
    .share-shell { width: min(980px, 100%); margin: 28px auto; padding: 0 16px; }
    .share-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .live-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 99px; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 700; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .share-hero { color: #fff; padding: 24px; border-radius: 16px 16px 0 0; }
    .share-body { background: #fff; border: 1px solid #e2e8f0; border-top: 0; border-radius: 0 0 16px 16px; padding: 22px; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .share-fact { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
    .share-fact small { display: block; color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .share-fact b { display: block; margin-top: 4px; font-size: 13px; }
    .loading { padding: 60px 20px; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <div class="share-shell" id="share-root"><div class="loading">Loading secure client document…</div></div>
  <script src="/config.js"></script>
  <script src="/share.js"></script>
</body>
</html>
