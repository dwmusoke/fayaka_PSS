name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile db.py server.py documents.py ingest.py air_parser.py
      - name: JS syntax
        run: |
          node --check static/app.js
          node --check static/portal.js
          node --check static/agency.js
          node --check static/share.js
      - name: Import check
        run: python -c "import server"
